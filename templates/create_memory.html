{% extends 'base.html' %}
{% block title %} MEMORY {% endblock %}

{% block content %}
<h1> ECHOES OF LIFE </h1>
Preserving memories, securing moments forever!!

<form method="POST" action="{{url_for('create_memory')}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="title" placeholder="Memory title" maxlength="200" required><br><br>
    <textarea name="message" placeholder="Write your memory here" maxlength="20000" required></textarea><br><br>
    <label>Open Date:</label>
    <input type="date" name="open_date" required><br><br>
    <input type="submit" value="Create Memory">
</form>


{% endblock %}
