{% extends 'base.html' %}
{% block title %} RESET PASSWORD {% endblock %}

{% block content %}
<h1> RESET PASSWORD </h1>
Enter the 6-digit code sent to {{ email }} and choose a new password.

<form method="POST" action="{{url_for('reset_password')}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
           placeholder="6-digit code" autocomplete="one-time-code"><br>
    <input type="password" name="password" placeholder="New password" autocomplete="new-password"><br>
    <input type="password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password"><br>
    <input type="submit" value="Reset password">
</form>

<form method="POST" action="{{url_for('reset_resend')}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="submit" value="Resend code">
</form>

<a href="{{url_for('forgot_password')}}">Start over</a>
<a href="{{url_for('login')}}">Back to login</a>
{% endblock %}
